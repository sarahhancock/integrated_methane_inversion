## IMI configuration file
## Documentation @ https://imi.readthedocs.io/en/latest/getting-started/imi-config-file.html

## General
RunName: "Test_Permian_1week"
Species: "CH4"
SchedulerType: "slurm"
SafeMode: true
S3Upload: false
UseGCHP: false

## Period of interest
StartDate: 20180501
EndDate: 20180508
SpinupMonths: 1

CH4:
  ## What satellite data product should be used? Current options are:
  ##     "BlendedTROPOMI"  : The dataset generated by Balasus et al. in which
  ##                         the TROPOMI data are fit to GOSAT data using ML
  ##     "TROPOMI"         : The operational TROPOMI data
  ##     "Other"           : Any other dataset
  ## Currently, only "BlendedTROPOMI" and "TROPOMI" are supported on AWS. If
  ## "Other" is selected, the user must specify the path where observations are
  ## located under "Advanced settings" in this file.
  SatelliteProduct: "BlendedTROPOMI"
  ## Use observations over water? Set to false to filter out water observations
  UseWaterObs: false
  OptimizeOH: false
  # optimize soil option when using normal errors,
  # do not use it when using Lognormal errors as negative flux is not allowed with lognormal errors,
  # current version is not compatible with state vector clustering
  # either through clustering algorithm or buffer cluster for regional case
  OptimizeSoil: false
  PriorErrorOH: [0.1]
  # Save out GEOS-Chem diagnostics for additional observation operators
  AdditionalDiagnostics: ["ObsPack"]  ## GOSAT, TCCON, AIRS, PLANEFLIGHT

CO2:
  ## Supported products are OCO2
  SatelliteProduct: "OCO2"
  UseWaterObs: false
  # Save out GEOS-Chem diagnostics for additional observation operators
  AdditionalDiagnostics: ["ObsPack"]  ## TCCON, PLANEFLIGHT

## Is this a regional inversion? Set to false for global inversion
isRegional: true

## Select two character region ID (for using pre-cropped meteorological fields)
##   Current options are listed below with ([lat],[lon]) bounds:
##     "AF" : Africa ([-37,40], [-20,53])
##     "AS" : Asia ([-11,55],[60,150])
##     "EU" : Europe ([33,61],[-30,70])
##     "ME" : Middle East ([12,50], [-20,70])
##     "NA" : North America ([10,70],[-140,-40])
##     "OC" : Oceania ([-50,5], [110,180])
##     "RU" : Russia ([41,83], [19,180])
##     "SA" : South America ([-59,16], [-88,-31])
##     ""   : Use for global global simulation or custom regions
##   For example, if the region of interest is in Europe ([33,61],[-30,70]), select "EU".
RegionID: "NA"

## Region of interest
##   These lat/lon bounds are only used if CreateAutomaticRectilinearStateVectorFile: true
##   Otherwise lat/lon bounds are determined from StateVectorFile
LonMin: -105
LonMax: -103
LatMin: 31
LatMax: 33

## Meteorology
##   Options are GEOSFP or MERRA2
Met: "GEOSFP"

## Horizontal grid resolution
##   Options are 0.125x0.15625 (GEOS-FP only), 0.25x0.3125 (GEOS-FP only),
##   0.5x0.625, 2.0x2.5, or 4.0x5.0
Res: "0.25x0.3125"

## Grid settings for GCHP
##   CS resolution: even integer representing number of grid cells per cubed-sphere face side
CS_RES: 48
##   Use stretched grid?
STRETCH_GRID: false
STRETCH_FACTOR: 10.0
TARGET_LAT: 32.0
# note that target_lon needs to be in range of [-180,180) to accommandate the use of pygeohash for the convection of naming for gridspec file creation, the names for all target_lon > 180 would be the same with pygeohash
TARGET_LON: 256.0

## Kalman filter options
KalmanMode: false
UpdateFreqDays: 7
NudgeFactor: 0.1
MakePeriodsCSV: true
CustomPeriodsCSV: "/path/to/periods.csv"

## State vector
CreateAutomaticRectilinearStateVectorFile: true
nBufferClusters: 8
BufferDeg: 5
EmisThreshold: 1.e-12
OptimizeBCs: true

## Point source datasets
## Used for visualizations and state vector clustering
PointSourceDatasets: ["SRON"]

## Clustering Options
ReducedDimensionStateVector: false
DynamicKFClustering: false
ClusteringMethod: "kmeans"
NumberOfElements: 45
ForcedNativeResolutionElements:
  - [31.5, -104]
EmissionRateFilter: 2500
PlumeCountFilter: 50
GroupByCountry: false

## Custom state vector
StateVectorFile: "/home/ubuntu/integrated_methane_inversion/resources/statevectors/StateVector.nc"
ShapeFile: "/home/ubuntu/integrated_methane_inversion/resources/shapefiles/PermianBasin_Extent_201712.shp"

## Inversion
## Notes:
## - PriorError is a relative fraction (e.g. 0.5 = 50%)
## - If lognormal PriorError is the geometric standard deviation (e.g. 2 = factor of 2 uncertainty)
## - PriorErrorOH is a relative fraction (e.g. 0.1 = 10%)
## - PriorErrorBCs is in ppb
## - PriorErrorBufferElements is only used if LognormalErrors is true
LognormalErrors: false
PriorError: [0.5]
PriorErrorBCs: [10.0]
PriorErrorBufferElements: [0.5]
ObsError: [15]
Gamma: [1.0]
PrecomputedJacobian: false
OffDiagonalPriorCov: false
LengthScalePriorCov: 25  ## in km, only used if OffDiagonalPriorCov is true
## Options for OffDiagonalPriorCov:
##   PriorCovarianceMethod: "length_scale"        # default
##   PriorCovarianceMethod: "national_inventory" # country-sector aggregate uncertainties
## For PriorCovarianceMethod: "national_inventory", also set:
##   NationalPriorUncertaintyFile: "/path/to/national_prior_uncertainties.csv"
##   NationalPriorCountryMaskFile: "/path/to/country_mask_on_gc_grid.nc"
##   NationalPriorCountryMaskVariable: "country_id"
## Or use a countries shapefile directly:
##   NationalPriorCountryShapefile: "/path/to/countries.shp"
##   NationalPriorCountryNameColumn: "NAME"
##   PriorCovarianceMethod: "sector_ensemble"    # data-driven sector covariance (full method)
## For PriorCovarianceMethod: "sector_ensemble", Sa is the sum of three per-sector blocks:
##   (1) anthropogenic sectors -> two-component national covariance (uses the NationalPrior*
##       keys above: NationalPriorUncertaintyFile + country mask, GridNationalRatio, MinUncertainty);
##   (2) Wetlands -> ensemble covariance diag(sigma*E) exp(-d/L) diag(sigma*E) from a wetland
##       model ensemble (per-cell relative error + variogram length); enable by setting:
##         SectorEnsembleWetlandFile: "/path/to/wetland_ensemble_cov.npz"  # per-cell rel error on lat/lon (+ optional L_km)
##         SectorEnsembleWetlandVar: "rel"                # variable name (default "rel"); 3-D (month,lat,lon) is annual-averaged
##       # SectorEnsembleWetlandLengthKm: 161             # Default 161 km from Hancock South America work (else read L_km from file)
##   (3) remaining natural sectors + OtherAnth -> a generic correlated block
##       diag(sigma*E) [exp(-d/L) o cosine-similarity] diag(sigma*E):
##         SectorEnsembleGenericSigma: 0.5                # relative error (Yu et al. 2021)
##         SectorEnsembleGenericLengthKm: 200            # km (Yu et al. 2021)
##   # SectorEnsembleSigmaFloor: 0.15 ; SectorEnsembleSigmaCap: 2.0   # per-cell wetland sigma clip
##   # SectorEnsembleTwoComponentSectors / SectorEnsembleGenericSectors override the sector partition.
##
## GLOBAL BACKGROUND (makes the prior a THREE-component covariance; recommended for continental/global
## domains). Adds a domain-wide "global systematic" error per sector (magnitude = genuine Saunois et al.
## global sectoral uncertainty), so that aggregating emissions over a large area never drives the error
## unrealistically small. For two cells of one sector:
##     within the same country :  error = global + national + local
##     in different countries   :  error = global only
## The global part is PEELED from the reported (BTR) uncertainty in quadrature, so every NATIONAL
## aggregate still equals u_BTR EXACTLY -- only the continental/global aggregate is floored to Saunois.
## In practice this barely moves the anthropogenic sectors (genuine Saunois anthro values are small) and
## mainly lifts the wetland (short-correlation) sector at continental scale. Genuine Saunois defaults are
## built in, so no extra files are needed. Both are ON BY DEFAULT (the recommended method); set them to
## false only to reproduce the old two-component prior:
##   NationalPriorGlobalBackground: true            # anthro sectors (national_inventory & sector_ensemble); default true
##   SectorEnsembleWetlandGlobalBackground: true    # wetlands (correlation floor on the ensemble kernel); default true
##   # NationalPriorGlobalBackgroundValues: {Coal: 0.10, Oil: 0.15, ...}   # override the Saunois defaults
##   # SectorEnsembleWetlandGlobalValue: 0.28                              # Saunois global wetland 1-sigma

## Observational error covariance from the residual-error method (REM). ON BY DEFAULT: it replaces the
## uniform config ObsError with a PER-CELL diagonal So -- each cell's error magnitude (sk) is estimated
## from its own residual variance, then scaled by the Chen et al. (2023) super-observation count curve --
## and adds off-diagonal correlations: a two-exponential spatial rho(d) = A1*exp(-d/L1) + A2*exp(-d/L2)
## applied EXACTLY by a day-blocked solve, plus an adjacent-day (lag-1) temporal correlation. Set to
## false to fall back to the fixed, spatially-uniform ObsError (the upstream IMI default).
## Requires DoInversion: true, a completed Jacobian run, and per-observation lat/lon/dates.
OffDiagonalObsCov: true
## Off-diagonal So correlation parameters (two-exponential spatial rho(d) + adjacent-day temporal
## correlation, applied exactly by a day-blocked solve). Fit to South America TROPOMI residuals.
OffDiagonalObsCovA1: 0.385           # Default 0.385 from Hancock South America work
OffDiagonalObsCovL1: 26.0            # Default 26.0 km from Hancock South America work
OffDiagonalObsCovA2: 0.459           # Default 0.459 from Hancock South America work
OffDiagonalObsCovL2: 398.0           # Default 398.0 km from Hancock South America work
OffDiagonalObsCovTemporalRho: 0.19   # Default 0.19 from Hancock South America work
## OffDiagonalObsCovCutoffKm: 1194   # spatial cutoff (km); default = 3 * L2

## Setup modules
##   Turn on/off different steps in setting up the inversion
RunSetup: true
SetupTemplateRundir: true
SetupSpinupRun: false
SetupJacobianRuns: false
SetupInversion: false
SetupPosteriorRun: false

## Run modules
##   Turn on/off different steps in performing the inversion
DoHemcoPriorEmis: true
DoSpinup: false
DoJacobian: false
ReDoJacobian: false
DoInversion: false
DoPosterior: false

## IMI preview
##   NOTE: RunSetup must be true to run preview
DoPreview: true
DOFSThreshold: 0

## Resource allocation settings for slurm jobs
RequestedCPUs: 8
RequestedMemory: "10gb"
InversionCPUs: 32
InversionMemory: "32gb"
RequestedTime: "24:00:00"
SchedulerPartition: "debug"

## Max number of simultaneous Jacobian runs from the job array (-1: no limit)
MaxSimultaneousRuns: -1

## Number of Jacobians tracers to use for each jacobian simulation
##   Specifying a value = 1 will submit a separate jacobian simulation for each
##   state vector element. Specifying a value > 1 will combine state vector
##   elements into a single jacobian simulation.
NumJacobianTracers: 1

##====================================================================
##
## Advanced Settings (optional)
##
##====================================================================

## These settings are intended for advanced users who wish to:
##   a. modify additional GEOS-Chem options, or
##   b. run the IMI on a local cluster.
##   c. do an Observing System Simulation Experiment (OSSE)
## They can be ignored for any standard cloud application of the IMI.


##--------------------------------------------------------------------
## Settings for Observing System Simulation Experiment (OSSE)
##--------------------------------------------------------------------
## If true, the IMI will run on synthetic observations
EnableOSSE: false
## Run the simulation with randomly perturbed emissions to generate synthetic observations
DoOSSE: false
## Perturbation to apply to the prior emissions 
EmisPerturbationOSSE: 0.5
## Noise added to the synthetic observations
ObsErrorOSSE: 15
## Use randomly perturbed scale factor as "true" emissions (true)
CreateAutomaticScaleFactorFileOSSE: true
## Path to a custom scale factor file if CreateAutomaticScaleFactorFileOSSE is false
ScaleFactorFileOSSE: "/path/to/ScaleFactor.nc"

##--------------------------------------------------------------------
## Additional settings for GEOS-Chem simulations
##--------------------------------------------------------------------

## Jacobian settings
## Note PerturbValue is in 1e-8 kg/m2/s. eg specifying 1 means the
## perturbation will be 1e-8 kg/m2/s
## PerturbValueOH is a relative scale factor and PerturbValueBCs is in ppb
PerturbValue: 1.0
PerturbValueOH: 1.1
PerturbValueBCs: 10.0

## Save out hourly diagnostics from GEOS-Chem?
## For use in satellite operators via post-processing -- required for TROPOMI
## inversions
HourlySpecies: true

## IMI validation
## Turn on ObsPack diagnostic in GEOS-Chem?
DoObsPack: false

## Turn on planeflight diagnostic in GEOS-Chem?
## For use in comparing GEOS-Chem against planeflight data. The path
## to those data must be specified in geoschem_config.yml.
PLANEFLIGHT: false

## Turn on old observation operators in GEOS-Chem?
## These will save out text files comparing GEOS-Chem to observations, but have
## to be manually incorporated into the IMI
GOSAT: false
TCCON: false
AIRS: false

## Use global boundary condition files for initial conditions
UseBCsForRestart: False

##------------------------------------------------------------------
## Settings for running on local cluster
##------------------------------------------------------------------

## Path for IMI runs and output
OutputPath: "/home/ubuntu/imi_output_dir"

## Path to GEOS-Chem input data
DataPath: "/home/ubuntu/ExtData"

## Conda environment file
PythonEnv: "/home/ubuntu/integrated_methane_inversion/envs/aws/python.env"

## Download initial restart file from AWS S3?
##  NOTE: Must have AWS CLI enabled
RestartDownload: true

## Path to initial GEOS-Chem restart file + prefix
##   ("YYYYMMDD_0000z.nc4" will be appended)
RestartFilePrefix: "/home/ubuntu/ExtData/BoundaryConditions/v2025-12-blended/GEOSChem.BoundaryConditions."

## Path to GEOS-Chem boundary condition files (for regional simulations)
## BCversion will be appended to the end of this path. ${BCpath}/${BCversion}
BCpath: "/home/ubuntu/ExtData/BoundaryConditions"
BCversion: "v2025-12-blended"

## Options to download missing GEOS-Chem input data from AWS S3
HemcoPriorEmisDryRun: true
SpinupDryrun: true
ProductionDryRun: true
PosteriorDryRun: true
BCdryrun: true
